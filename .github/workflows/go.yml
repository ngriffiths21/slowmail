# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'

    - name: Build
      run: go build -v -o slowmail ./...

    - name: Upload build
      uses: actions/upload-artifact@v4
      with:
        name: slowmail

        # Executable path
        path: /home/runner/work/slowmail/slowmail/slowmail
        if-no-files-found: warn
        retention-days: 1
        compression-level: 0
        overwrite: true
